name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # Full validation suite (lint, typecheck, format, unit+E2E tests, builds,
  # bundle budget, responsive QA, security scan) — see validate.yml. Deploy
  # must not proceed unless this passes in full, not just backend tests.
  validate:
    uses: ./.github/workflows/validate.yml

  # Build and push Docker images
  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # GitHub Secrets must be configured in repository settings
      # Required: DOCKER_USERNAME, DOCKER_PASSWORD, PRODUCTION_HOST, PRODUCTION_USER, SSH_PRIVATE_KEY
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/caredroid-backend:latest,${{ secrets.DOCKER_USERNAME }}/caredroid-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to production
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/caredroid
            docker-compose pull
            docker-compose up -d
            docker system prune -af
