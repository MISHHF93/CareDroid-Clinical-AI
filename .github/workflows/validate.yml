name: Validate (CI gate)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  checks: write

env:
  NODE_VERSION: '20'

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: caredroid_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Blocking since 2026-09-03: the 37 drifted files were formatted and a
      # lefthook pre-commit hook checks the same scope locally, so this can
      # only go red when someone commits with LEFTHOOK=0. Scope is
      # js/jsx/json/css on purpose -- frontend .ts/.tsx never matched
      # .prettierrc (2,095 of 2,481 files) and is not enforced anywhere yet.
      - name: Format check
        run: npm run format:check

      - name: Validate (lint, tests, builds)
        run: npm run validate:ci
        env:
          CI: true
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: caredroid_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test

  responsive-playwright:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Responsive QA (360–430px viewports)
        run: npm run validate:responsive
        env:
          CI: true
          QA_BASE_URL: http://localhost:3000

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      # Blocking on new high/critical findings (Cycle 265). GHSA-f88m-g3jw-g9cj
      # (sharp/@xenova/transformers, libvips CVEs) is allowlisted, not hidden —
      # it's a known, already-triaged risk with no safe fix today (npm audit fix
      # --force only offers downgrading @xenova/transformers to a broken 1.4.2;
      # re-confirmed unfixable across many prior audit cycles, see SCORECARD.md).
      # GHSA-qwww-vcr4-c8h2 (Cycle 290, frontend-only: react-router/react-router-dom
      # "RSC Mode CSRF Bypass") is allowlisted too, on stronger grounds than a
      # deferred migration -- the advisory itself states it "only affects your
      # application if you are using the unstable RSC APIs." This app uses
      # react-router-dom's plain client-side <BrowserRouter> (src/app/App.tsx),
      # not React Router's Framework Mode: no react-router.config.ts, no
      # @react-router/dev, no RSC/loader/action server integration anywhere in
      # this repo. The fixed version (8.3.0) also does not exist on npm yet as
      # of this writing -- the only "fix" available is downgrading below the
      # affected range (7.11.0), which is unnecessary for code that was never
      # exposed to begin with.
      # audit-ci still prints and flags both allowlisted findings every run so
      # they stay visible, they just don't fail the build for risks already
      # accepted. Any NEW high/critical finding, on either tree, fails for real.
      - name: Run npm audit (frontend, blocking on new high/critical)
        run: npx audit-ci@7.1.0 --high --allowlist GHSA-f88m-g3jw-g9cj GHSA-qwww-vcr4-c8h2

      - name: Run npm audit (backend, blocking on new high/critical)
        working-directory: backend
        run: npx audit-ci@7.1.0 --high --allowlist GHSA-f88m-g3jw-g9cj

      - name: Check outdated dependencies
        run: npm outdated
        continue-on-error: true
