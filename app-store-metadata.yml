# CareDroid — App Store Metadata (ED operating platform)

name: "CareDroid"
subtitle: "Reception-first emergency department operations"

description: |
  CareDroid is a reception-first emergency department operating platform for hospitals and ED teams.

  Built for roughly 100 patients per day and teams under 10 staff. Registration clerks resolve arrivals at the front desk; triage, charge nurse, physician, and display roles share one department whiteboard.

  KEY CAPABILITIES:

  Reception & Arrival
  • EMS pre-arrival visibility
  • Walk-in registration and identity verification
  • Pretriage handoff to nursing staff

  Emergency Whiteboard
  • Patient cards, queue visibility, and reassessment timers
  • Role-scoped views for charge nurse, physician, and manager

  Clinical Support
  • CareDroid Copilot — human-reviewed decision support
  • ED calculators (qSOFA, NEWS2, HEART, Wells, GCS, NIHSS, and more)
  • EMS offload and referral coordination

  Operations
  • Department pulse, shift summary, throughput analytics
  • Simulation and training datasets for onboarding

  DESIGNED FOR:
  • Registration clerks and front-desk staff
  • Triage nurses and charge nurses
  • Emergency physicians and ED managers
  • EMS handoff teams

  DISCLAIMER:
  CareDroid is decision support only. It is not an autonomous clinician and does not replace professional medical judgment, prescribing, order entry, or EHR systems. Staff must review all AI output before clinical action.

