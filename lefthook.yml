# Git hooks (lefthook, a repo-local devDependency; installed by `npm install`
# through the `prepare` script; skip once with `LEFTHOOK=0 git commit`).
#
# Scope: everything `npm run format:check` covers (frontend
# js/jsx/ts/tsx/json/css under src/) plus the whole backend (its ESLint
# enforces prettier/prettier). The frontend .ts/.tsx files were reformatted in
# one deliberate commit on 2026-09-03 (1,988 files), then scripts/*.mjs
# (119 files), so this can hold the line from here on.
#
# Why this exists: on 2026-09-03 backend lint (part of validate:ci) had 1,277
# Prettier errors accumulated across a week of commits nobody could see
# locally, and the frontend check had 37 drifted files behind a
# continue-on-error. The hook only CHECKS; it never rewrites your files.
pre-commit:
  parallel: true
  commands:
    prettier-frontend:
      glob: '{src/**/*.{js,jsx,ts,tsx,json,css},scripts/**/*.mjs}'
      run: npx prettier --check {staged_files}
      fail_text: 'Prettier drift. Fix with: npx prettier --write <file>  (then git add it)'
    # Uses the backend's own prettier binary -- root (3.8) and backend (3.6)
    # disagree on a handful of files, and backend ESLint is the 3.6 opinion.
    prettier-backend:
      glob: 'backend/{src,test}/**/*.ts'
      run: node backend/node_modules/prettier/bin/prettier.cjs --check {staged_files}
      fail_text: 'Prettier drift. Fix with: cd backend && npx prettier --write <file>  (then git add it)'
    # lefthook renamed any hook that was here before it to pre-commit.old and
    # would not call it again; this keeps machine-local tooling working.
    displaced-hook:
      run: node scripts/run-displaced-hook.mjs pre-commit
